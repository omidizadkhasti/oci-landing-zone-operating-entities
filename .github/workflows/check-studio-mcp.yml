name: Check Studio headless core and MCP

on:
  pull_request:
    paths: ['addons/oci-landingzone-studio/**', 'gen/**', '.github/workflows/check-studio-mcp.yml']
  push:
    branches: [master]
    paths: ['addons/oci-landingzone-studio/**', 'gen/**', '.github/workflows/check-studio-mcp.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: addons/oci-landingzone-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: addons/oci-landingzone-studio/3rd/go-jsonnet/go.sum
      - name: Install locked dependencies without lifecycle hooks
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          npm ci --ignore-scripts --registry=https://registry.npmjs.org --prefix mcp
      - name: Build matching Go WASM runtime
        run: bash 3rd/go-jsonnet/ensure.sh
      - name: Verify UI, generator parity and MCP boundaries
        run: |
          npm --ignore-scripts run typecheck
          npm --ignore-scripts run lint
          npm --ignore-scripts run test -- --maxWorkers=2
          npm --ignore-scripts run build
          npm run typecheck --prefix mcp
          npm test --prefix mcp
      - name: Audit service dependencies and produce runtime SBOM
        run: |
          npm audit --audit-level=moderate --registry=https://registry.npmjs.org --prefix mcp
          cd mcp
          npm sbom --omit=dev --sbom-format=cyclonedx > mcp-sbom.cdx.json
      - name: Verify container packaging without publishing credentials or images
        working-directory: .
        run: docker build -f addons/oci-landingzone-studio/mcp/Dockerfile -t studio-mcp:ci .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-mcp-schema-and-sbom
          path: |
            addons/oci-landingzone-studio/mcp/mcp-sbom.cdx.json
            addons/oci-landingzone-studio/mcp/dist/design.schema.json

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
